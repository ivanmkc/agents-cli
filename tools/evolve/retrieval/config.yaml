# AlphaEvolve run configuration for the retrieval-layer evolution loop
# (use case 3). Compatible with OpenEvolve-style runners:
#
#   PYTHONPATH=tools python -m openevolve.run \
#       tools/evolve/retrieval/search_tool.py \
#       tools/evolve/retrieval/evaluate.py \
#       --config tools/evolve/retrieval/config.yaml

max_iterations: 200
checkpoint_interval: 10

llm:
  # Mutation models: a fast model for volume, a strong one for depth.
  models:
    - name: gemini-2.5-flash
      weight: 0.7
    - name: gemini-2.5-pro
      weight: 0.3
  temperature: 0.8

prompt:
  system_message: |
    You are optimizing the code-search tool that coding agents use to
    retrieve context from large monorepos. Only edit code between
    # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END in search_tool.py.

    The tool must return the smallest set of line-addressed chunks that
    answers the query. Fitness rewards:
      - recall: ground-truth spans surfaced at all
      - precision: fraction of returned tokens that are relevant
        (returning whole files is heavily penalized)
      - mrr: the first relevant chunk should be ranked first
    Ideas with headroom: AST-aware chunking, import-graph traversal for
    "find usages" queries, camelCase/snake_case sub-token matching,
    two-pass filtering, smarter stopword handling.
  num_top_programs: 3
  use_template_stochasticity: true

database:
  population_size: 50
  archive_size: 20
  num_islands: 3

evaluator:
  timeout: 300
  # evaluate_stage1 screens each mutant on 20 tasks before the full
  # benchmark runs; broken candidates die cheaply.
  cascade_evaluation: true
  cascade_thresholds: [0.3]
  parallel_evaluations: 4

diff_based_evolution: true
allow_full_rewrites: false
